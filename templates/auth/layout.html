<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ForgeMind{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-[#121212] text-zinc-100 flex items-center justify-center p-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="fixed top-4 right-4 space-y-2 z-50">
        {% for cat, msg in messages %}
        <div class="text-xs rounded-xl px-3 py-2 border {% if cat == 'error' %}bg-red-500/10 border-red-500/40 text-red-300{% else %}bg-emerald-500/10 border-emerald-500/40 text-emerald-300{% endif %}">{{ msg }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}
    {% block body %}{% endblock %}
</body>
</html>
